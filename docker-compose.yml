services:
  app:
    build: .
    image: moontech-app
    container_name: moontech-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      PHP_OPCACHE_ENABLE: '0'
    networks:
      - moontech
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    image: moontech-app
    container_name: moontech-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: php artisan queue:work --tries=3 --timeout=90
    networks:
      - moontech
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: moontech-nginx
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8080}:80'
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - moontech
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: moontech-mysql
    restart: unless-stopped
    ports:
      - '${FORWARD_DB_PORT:-3307}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
      MYSQL_DATABASE: '${DB_DATABASE:-laravel}'
      MYSQL_USER: '${DB_USERNAME:-laravel}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
    volumes:
      - moontech-mysql:/var/lib/mysql
    networks:
      - moontech
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD:-password}']
      retries: 3
      timeout: 5s

networks:
  moontech:
    driver: bridge

volumes:
  moontech-mysql:
